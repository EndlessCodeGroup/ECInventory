name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run Check
        run: ./gradlew check
        env:
          warningsAsErrors: true
